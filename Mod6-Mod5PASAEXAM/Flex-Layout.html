<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./flex-style.css" />
    <title>Flex Layout Act</title>
</head>
<body>
    <header>
        <nav class="nav-container" id="nav-container">
                <ul class="nav-menu">
                    <li><a href="#Card1">Card 1</a></li>
                    <li><a href="#Card2">Card 2</a></li>
                    <li><a href="#Card3">Card 3</a></li>
                    <li><a href="#Card4">Card 4</a></li>
                    <li><a href="">Home</a></li>
                </ul>
        </nav>
    </header>
    <main>
        <div class="card-grid" id="card-grid">
            <div class="Card1 card">
                <h2 class="header">Ace of Spades</h2>
                <p class="content">First card of the deck</p>
                <button class="card-buttons">Button1</button>
            </div>
            <div class="Card2 card">
                <h2 class="header">King of Hearts</h2>
                <p class="content">Last card of the deck</p>
                <button class="card-buttons">Button2</button>
            </div>
            <div class="Card3 card">
                <h2 class="header">7 Diamonds</h2>
                <p class="content">Lucky number of the many</p>
                <button class="card-buttons">Button3</button>
            </div>
        </div>
    </main>
</body>
</html>
